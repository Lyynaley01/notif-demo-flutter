name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Setup project
        run: |
          flutter create --platforms=android --project-name notif_demo_flutter build_src
          cp lib/main.dart build_src/lib/main.dart
          cp pubspec.yaml build_src/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml build_src/android/app/src/main/AndroidManifest.xml
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          for density, size in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              dst = f"build_src/android/app/src/main/res/mipmap-{density}"
              os.makedirs(dst, exist_ok=True)
              Image.open(src).resize((size,size),Image.LANCZOS).save(f"{dst}/ic_launcher.png")
          PY

      - name: Configure desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base = Path("build_src/android/app")
          gradle = base/"build.gradle.kts" if (base/"build.gradle.kts").exists() else base/"build.gradle"
          kts = gradle.suffix == ".kts"
          text = gradle.read_text()
          if kts:
              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = re.sub(r"compileOptions\s*\{","compileOptions {\n        isCoreLibraryDesugaringEnabled = true",text,1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              if "coreLibraryDesugaringEnabled" not in text:
                  text = re.sub(r"compileOptions\s*\{","compileOptions {\n        coreLibraryDesugaringEnabled true",text,1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dep not in text:
              text = re.sub(r"dependencies\s*\{",lambda m: m.group(0)+"\n    "+dep,text,1)
          gradle.write_text(text)
          PY

      - name: Build APK
        working-directory: build_src
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: notif-demo-apk
          path: build_src/build/a
