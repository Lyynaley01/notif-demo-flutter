name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Setup project
        run: |
          flutter create --platforms=android --project-name notif_demo_flutter build_src
          cp lib/main.dart build_src/lib/main.dart
          cp pubspec.yaml build_src/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml build_src/android/app/src/main/AndroidManifest.xml
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          import os
          src = "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          for density, size in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              dst = f"build_src/android/app/src/main/res/mipmap-{density}"
              os.makedirs(dst, exist_ok=True)
              Image.open(src).resize((size,size),Image.LANCZOS).save(f"{dst}/ic_launcher.png")
          PY

      - name: Patch build.gradle
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("build_src/android/app/build.gradle")
          t = p.read_text()

          # Fix compileSdk
          t = re.sub(r'(compileSdk\s*=?\s*)\d+', r'\g<1>35', t)
          t = re.sub(r'(compileSdkVersion\s*)\d+', r'\g<1>35', t)

          # Fix targetSdk
          t = re.sub(r'(targetSdk\s*=?\s*)\d+', r'\g<1>35', t)
          t = re.sub(r'(targetSdkVersion\s*)\d+', r'\g<1>35', t)

          # Enable desugaring dalam compileOptions block
          if 'coreLibraryDesugaringEnabled' not in t:
              t = re.sub(
                  r'(compileOptions\s*\{)',
                  r'\1\n        coreLibraryDesugaringEnabled true',
                  t
              )

          # Tambah dependency
          if 'desugar_jdk_libs' not in t:
              t = re.sub(
                  r'(dependencies\s*\{)',
                  r"\1\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                  t
              )

          p.write_text(t)
          print("Patched build.gradle:")
          print(t)
          PY

      - name: Build APK
        working-directory: build_src
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: notif-demo-apk
          path: build_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
