name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Setup project
        run: |
          flutter create --platforms=android --project-name notif_demo_flutter build_src
          cp lib/main.dart build_src/lib/main.dart
          cp pubspec.yaml build_src/pubspec.yaml
          cp android/app/src/main/AndroidManifest.xml build_src/android/app/src/main/AndroidManifest.xml
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          for density, size in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              dst = f"build_src/android/app/src/main/res/mipmap-{density}"
              os.makedirs(dst, exist_ok=True)
              Image.open(src).resize((size,size),Image.LANCZOS).save(f"{dst}/ic_launcher.png")
          PY

      - name: Patch build.gradle
        run: |
          GRADLE="build_src/android/app/build.gradle.kts"
          if [ ! -f "$GRADLE" ]; then
            GRADLE="build_src/android/app/build.gradle"
          fi
          echo "Patching: $GRADLE"
          cat "$GRADLE"

          # Fix compileSdk ke 35
          sed -i 's/compileSdk = [0-9]*/compileSdk = 35/' "$GRADLE"
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' "$GRADLE"

          # Fix targetSdk ke 35
          sed -i 's/targetSdk = [0-9]*/targetSdk = 35/' "$GRADLE"
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/' "$GRADLE"

          # Enable coreLibraryDesugaring
          sed -i 's/isCoreLibraryDesugaringEnabled = false/isCoreLibraryDesugaringEnabled = true/' "$GRADLE"
          if ! grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE"; then
            sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$GRADLE"
          fi

          # Tambah dependency desugaring
          if ! grep -q "desugar_jdk_libs" "$GRADLE"; then
            sed -i '/^dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' "$GRADLE"
          fi

          echo "--- After patch ---"
          cat "$GRADLE"

      - name: Build APK
        working-directory: build_src
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: notif-demo-apk
          path: build_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
